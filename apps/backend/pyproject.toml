[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  \.venv
  | data
  | models
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "data", "models"]
known_first_party = [
    "memory",
    "runtime",
    "services",
    "identity",
    "paths",
    "conversation_memory",
    "memory_producers",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(^|/)(\\.venv|data|models)/"
# Intentionally lenient on *unannotated* code (most function bodies predate
# type-checking): we don't require full annotation coverage yet. But once a
# function has a return-type annotation, mypy checks its body — that already
# catches real bugs (see the fixes that closed DEBT(nova-ci-1)) — so this is
# blocking in CI, not report-only.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
